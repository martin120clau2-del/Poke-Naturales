<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poke-Naturales</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <main class="pantalla" id="pantalla-inicio">

    <!-- Logo circular arriba a la izquierda -->
    <div class="logo-wrap">
      <img src="../Recursos Graficos/logopokenaturales.png" alt="Logo Ciencias Naturales" class="logo-img"
           onerror="this.style.display='none'" />
    </div>

    <!-- Título del juego -->
    <h1 class="titulo">POKE-<br />NATURALES</h1>

    <!-- Menú principal -->
    <nav class="menu-principal">
      <button type="button" class="boton-menu">Modo Alumno</button>
      <button type="button" class="boton-menu">Modo Docente</button>
      <button type="button" class="boton-menu">Ajustes</button>
    </nav>

    <!-- Panel de nombre y selección de personaje -->
    <div class="panel-personaje">

      <input type="text" class="input-nombre" placeholder="Nombre y Apellido" maxlength="30" />

      <div class="selector-numeros">
        <button type="button" class="num-btn">1</button>
        <button type="button" class="num-btn">2</button>
        <button type="button" class="num-btn">3</button>
        <button type="button" class="num-btn">4</button>
        <button type="button" class="num-btn num-btn--activo">5</button>
      </div>

      <div class="marco-personaje">
        <img src="../Recursos Graficos/Pj.png" alt="Personaje seleccionado" class="personaje-img" />
      </div>

    </div>

  </main>

</body>
</html>
