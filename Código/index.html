<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Permite utilizar tildes, ñ y otros caracteres -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares y computadoras -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nombre que aparece en la pestaña -->
    <title>Poke-Naturales</title>

    <!-- Conectamos este HTML con el archivo CSS -->
    <link rel="stylesheet" href="estilos.css">

</head>


<body>

    <!-- ==========================================
         PANTALLA PRINCIPAL
         ========================================== -->

    <main class="inicio">


        <!-- ======================================
             LOGO / NOMBRE DEL JUEGO
             ====================================== -->

        <section class="logo">

            <h1>POKE-</h1>
            <h1>NATURALES</h1>

        </section>


        <!-- ======================================
             NOMBRE DEL JUGADOR
             ====================================== -->

        <section class="nombre-jugador">

            <label for="nombre">
                Nombre y Apellido
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Nombre y Apellido"
            >

        </section>


        <!-- ======================================
             ELECCIÓN DEL PERSONAJE
             ====================================== -->

        <section class="seleccion-personaje">

            <p>
                Elegí tu personaje
            </p>


            <div class="personajes">

                <!-- Personaje 1 -->
                <button class="personaje seleccionado">
                    1
                </button>


                <!-- Personaje 2 -->
                <button class="personaje">
                    2
                </button>


                <!-- Personaje 3 -->
                <button class="personaje">
                    3
                </button>


                <!-- Personaje 4 -->
                <button class="personaje">
                    4
                </button>


                <!-- Personaje 5 -->
                <button class="personaje">
                    5
                </button>

            </div>

        </section>


        <!-- ======================================
             MENÚ PRINCIPAL
             ====================================== -->

        <nav class="menu">


            <!-- ================================
                 MODO ALUMNO
                 ================================ -->

            <a href="#" class="boton">
                Modo Alumno
            </a>


            <!-- ================================
                 MODO DOCENTE
                 ================================ -->

            <a href="#" class="boton">
                Modo Docente
            </a>


            <!-- ================================
                 AJUSTES
                 ================================ -->

            <a href="#" class="boton">
                Ajustes
            </a>


        </nav>


    </main>

</body>

</html>
